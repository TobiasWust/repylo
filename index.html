<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2ed3b7" />
    <meta name="description" content="repylo – Every rep counts. Trainingstagebuch ohne Account." />
    <title>repylo</title>
    <!-- Privacy-friendly visit counter: no cookies, no personal data. It skips localhost. -->
    <script data-goatcounter="https://repylo.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Boot watchdog in plain JS (no React, no bundle): if the app hasn't
      rendered after 12 s, show what went wrong plus a way to clear a stale
      app cache. Works even when loading the app bundle itself fails.
    -->
    <script>
      (function () {
        var errors = [];
        addEventListener("error", function (e) {
          errors.push(e.message || (e.target && (e.target.src || e.target.href)) || "error");
        }, true);
        addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          errors.push("Promise: " + ((r && (r.message || r.type)) || String(r)));
        });
        var de = (navigator.language || "").toLowerCase().indexOf("de") === 0;
        function txt(d, e) { return de ? d : e; }
        function info() {
          var s = navigator.storage;
          return [
            "UA: " + navigator.userAgent,
            "standalone: " + matchMedia("(display-mode: standalone)").matches,
            "SharedWorker: " + (typeof SharedWorker),
            "Worker: " + (typeof Worker),
            "locks: " + !!navigator.locks,
            "OPFS: " + !!(s && s.getDirectory),
            "indexedDB: " + (typeof indexedDB),
            "serviceWorker: " + !!(navigator.serviceWorker && navigator.serviceWorker.controller),
            "errors: " + (errors.length ? errors.join(" | ") : "none"),
          ].join("\n");
        }
        function button(label, onClick, dark) {
          var b = document.createElement("button");
          b.textContent = label;
          b.style.cssText = "padding:12px 16px;border:2.5px solid #141414;border-radius:14px;font:700 15px system-ui,sans-serif;background:" + (dark ? "#141414;color:#fff" : "#fff;color:#141414");
          b.onclick = onClick;
          return b;
        }
        function show() {
          var box = document.createElement("div");
          box.style.cssText = "position:fixed;inset:auto 12px 12px 12px;z-index:9999;background:#ffd96a;border:2.5px solid #141414;border-radius:18px;box-shadow:4px 4px 0 #141414;padding:16px;display:flex;flex-direction:column;gap:10px;font:15px system-ui,sans-serif;color:#141414";
          var title = document.createElement("strong");
          title.textContent = txt("repylo startet gerade nicht.", "repylo isn't starting.");
          var hint = document.createElement("div");
          hint.textContent = txt("Deine Trainingsdaten bleiben erhalten. Schick mir die Infos, damit ich den Fehler finde.", "Your workout data is safe. Send these details so the problem can be found.");
          var pre = document.createElement("textarea");
          pre.readOnly = true;
          pre.value = info();
          pre.style.cssText = "height:120px;font:12px ui-monospace,monospace;border:2px solid #141414;border-radius:10px;padding:8px";
          var row = document.createElement("div");
          row.style.cssText = "display:flex;flex-wrap:wrap;gap:8px";
          row.appendChild(button(txt("Infos kopieren", "Copy details"), function () {
            pre.select();
            if (navigator.clipboard) navigator.clipboard.writeText(pre.value); else document.execCommand("copy");
          }));
          row.appendChild(button(txt("Neu laden", "Reload"), function () { location.reload(); }));
          row.appendChild(button(txt("Cache leeren & neu laden", "Clear cache & reload"), function () {
            var jobs = [];
            if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
            if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
            Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
          }, true));
          box.appendChild(title);
          box.appendChild(hint);
          box.appendChild(pre);
          box.appendChild(row);
          document.body.appendChild(box);
        }
        setTimeout(function () { if (!document.documentElement.dataset.ready) show(); }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
